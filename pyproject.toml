[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NamiTorch"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
namitorch-prepare-corpus = "namitorch.cli.prepare_corpus:main"
namitorch-train = "namitorch.cli.train:main"

[tool.setuptools.dynamic]
version = {attr = "namitorch.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["namitorch", "namitorch.*"]
namespaces = false

[tool.namitorch.architecture.dependencies]
namitorch = ["namitorch.dtype", "namitorch.tensor", "namitorch.creation", "namitorch.ops", "namitorch.random", "namitorch.serialization", "namitorch.autograd", "namitorch.nn", "namitorch.optim", "namitorch.data", "namitorch.tokenization", "namitorch.models", "namitorch.utils", "namitorch.training"]
"namitorch.utils" = []
"namitorch.testing" = ["namitorch.tensor", "namitorch.dtype", "namitorch.autograd"]
"namitorch.dtype" = ["namitorch.utils"]
"namitorch._backend" = ["namitorch.dtype", "namitorch.utils"]
"namitorch._convolution" = []
"namitorch._pooling" = ["namitorch._convolution"]
"namitorch.autograd" = ["namitorch._backend", "namitorch._convolution", "namitorch._pooling", "namitorch.dtype", "namitorch.utils"]
"namitorch.tensor" = ["namitorch.autograd", "namitorch._backend", "namitorch.dtype", "namitorch.utils"]
"namitorch.creation" = ["namitorch.tensor", "namitorch.dtype", "namitorch.utils"]
"namitorch.ops" = ["namitorch.tensor", "namitorch.autograd", "namitorch._backend", "namitorch.dtype", "namitorch.utils"]
"namitorch.random" = ["namitorch.tensor", "namitorch._backend", "namitorch.dtype", "namitorch.utils"]
"namitorch.nn.functional" = ["namitorch.tensor", "namitorch.ops", "namitorch.random", "namitorch.utils", "namitorch.autograd", "namitorch._convolution", "namitorch._pooling", "namitorch.dtype"]
"namitorch.nn.init" = ["namitorch.tensor", "namitorch.ops", "namitorch.random", "namitorch.dtype", "namitorch.utils", "namitorch.autograd"]
"namitorch.nn.parameter" = ["namitorch.tensor"]
"namitorch.nn" = ["namitorch.nn.functional", "namitorch.nn.init", "namitorch.nn.parameter", "namitorch.tensor", "namitorch.ops", "namitorch.random", "namitorch.dtype", "namitorch.utils", "namitorch.autograd", "namitorch.creation"]
"namitorch.optim.optimizer" = ["namitorch.nn.parameter", "namitorch.tensor", "namitorch.autograd", "namitorch.dtype", "namitorch.utils"]
"namitorch.optim" = ["namitorch.optim.optimizer", "namitorch.optim.lr_scheduler", "namitorch.nn.parameter", "namitorch.tensor", "namitorch.ops", "namitorch.autograd", "namitorch.dtype", "namitorch.utils"]
"namitorch.optim.lr_scheduler" = ["namitorch.optim.optimizer", "namitorch.utils"]
"namitorch.data" = ["namitorch.tensor", "namitorch.ops", "namitorch.random", "namitorch.utils"]
"namitorch.serialization" = ["namitorch.tensor", "namitorch._backend", "namitorch.dtype", "namitorch.utils"]
"namitorch.tokenization" = ["namitorch.utils"]
"namitorch.models" = ["namitorch.models.gpt", "namitorch.models.generation"]
"namitorch.models.generation" = ["namitorch.nn.functional", "namitorch.tensor", "namitorch.random"]
"namitorch.models.gpt" = ["namitorch.nn", "namitorch.nn.functional", "namitorch.nn.init", "namitorch.tensor", "namitorch.ops", "namitorch.random", "namitorch.dtype", "namitorch.utils", "namitorch.autograd", "namitorch.models.generation"]
"namitorch.training" = ["namitorch.nn", "namitorch.tensor", "namitorch.ops", "namitorch.autograd", "namitorch.optim", "namitorch.optim.optimizer", "namitorch.optim.lr_scheduler", "namitorch.data", "namitorch.random", "namitorch.serialization", "namitorch.utils", "namitorch.models", "namitorch.tokenization"]
"namitorch.cli" = ["namitorch.training", "namitorch.models"]
